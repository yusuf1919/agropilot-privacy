<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AgroCepte — E-posta Doğrulandı</title>
    <style>
      :root {
        color-scheme: light;
        --accent: #2d6a4f;
        --accent-soft: #e8f3ec;
        --text: #1b1b1f;
        --muted: #5c5f66;
        --card: #ffffff;
        --bg: #f7faf8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
      }

      main {
        width: 100%;
        max-width: 420px;
        background: var(--card);
        border-radius: 20px;
        padding: 40px 28px 36px;
        text-align: center;
        box-shadow: 0 12px 40px rgba(45, 106, 79, 0.1);
        border: 1px solid rgba(45, 106, 79, 0.08);
      }

      .logo-wrap {
        width: 96px;
        height: 96px;
        margin: 0 auto 24px;
        border-radius: 22px;
        background: var(--accent-soft);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .logo-wrap svg {
        width: 64px;
        height: 64px;
        display: block;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(1.35rem, 4vw, 1.6rem);
        font-weight: 700;
        color: var(--accent);
        letter-spacing: -0.02em;
      }

      .welcome {
        margin: 0 0 8px;
        font-size: 1.05rem;
        color: var(--text);
        font-weight: 600;
      }

      .hint {
        margin: 0;
        font-size: 0.95rem;
        color: var(--muted);
      }

      footer {
        margin-top: 28px;
        font-size: 0.8rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo-wrap" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AgroCepte">
          <rect width="64" height="64" rx="14" fill="#2D6A4F"/>
          <path d="M32 14C24 22 18 30 18 38a14 14 0 1 0 28 0c0-8-6-16-14-24z" fill="#95D5B2"/>
          <path d="M32 22v26M32 32c-4 2-7 5-9 9" stroke="#D8F3DC" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </div>
      <h1>E-posta adresiniz doğrulandı</h1>
      <p class="welcome">AgroCepte'ye hoş geldiniz.</p>
      <p class="hint">Artık uygulamaya dönebilirsiniz.</p>
      <footer>AgroCepte</footer>
    </main>
  </body>
</html>
